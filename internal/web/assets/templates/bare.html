{{define "bare"}}<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>{{.L.T .Title "name" .TitleArg}} · smbdeck</title>
<link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "app.css"}}">
<script src="{{asset "app.js"}}" defer></script>
</head>
<body class="bare">
<a class="skip" href="#main">{{.L.T "a11y.skip"}}</a>
<div class="bare__grid" aria-hidden="true"></div>
<header class="bare__top">
  <span class="brand">{{template "mark"}}<span class="brand__word">smbdeck</span></span>
  {{template "langs" .}}
</header>
<main id="main" class="bare__main" tabindex="-1">
  {{template "content" .}}
</main>
<footer class="footer footer--bare"><span class="mono">smbdeck {{.Version}}</span></footer>
</body>
</html>
{{end}}
