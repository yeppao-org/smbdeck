{{define "content"}}
<section class="authcard">
  <p class="eyebrow">{{.L.T "login.eyebrow"}}</p>
  <h1 class="title">{{.L.T "login.heading"}}</h1>
  <p class="lead">{{.L.T "login.lead"}}</p>
  {{template "flash" .}}
  {{template "errors" .}}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="pre" value="{{.Data.Pre}}">
    <div class="field">
      <label class="field__label" for="login-name">{{.L.T "field.account"}}</label>
      <input class="input" id="login-name" name="name" value="{{.Data.Name}}" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" autofocus>
    </div>
    <div class="field">
      <label class="field__label" for="login-password">{{.L.T "field.password"}}</label>
      <div class="input-group">
        <input class="input" type="password" id="login-password" name="password" autocomplete="current-password" required maxlength="256">
        {{template "reveal-btn" (dict "L" .L "For" "login-password")}}
      </div>
    </div>
    <button class="btn btn--primary btn--block" type="submit">{{.L.T "login.submit"}}</button>
  </form>
</section>
{{end}}
