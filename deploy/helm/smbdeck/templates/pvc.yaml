{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
# The state volume: desired state (holds NT hashes, treat it as a secret),
# agent status, folder tree and audit journal.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "smbdeck.stateClaim" . }}
  labels:
    {{- include "smbdeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- if or .Values.persistence.keep .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
