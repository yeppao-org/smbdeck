{{- $seen := dict }}
{{- range .Values.roots }}
{{- if not (regexMatch "^[a-z0-9][a-z0-9_-]{0,31}$" (toString .name)) }}
{{- fail (printf "roots: %q is not a valid root name (lower-case letters, digits, - and _)" (toString .name)) }}
{{- end }}
{{- if hasKey $seen .name }}
{{- fail (printf "roots: %q is declared twice" .name) }}
{{- end }}
{{- $_ := set $seen .name true }}
{{- if not .hostPath }}
{{- fail (printf "roots: %q needs a hostPath" .name) }}
{{- end }}
{{- end }}
{{- if and .Values.ingress.enabled (not .Values.web.trustedProxies) }}
{{- fail "ingress.enabled needs web.trustedProxies (the ingress controller's addresses): without it the console sees the controller, not the client, and its network filter is meaningless" }}
{{- end }}
{{- if and .Values.seed.enabled (not .Values.seed.passwordsSecret) }}
{{- fail "seed.passwordsSecret is required when seed.enabled is true (one key per account, the initial password)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smbdeck.fullname" . }}
  labels:
    {{- include "smbdeck.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # One smbd per set of disks: two pods would fight over Samba's locks and the
  # desired state. Recreate stops the old pod before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "smbdeck.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smbdeck.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if .Values.seed.enabled }}
        checksum/seed: {{ include (print $.Template.BasePath "/seed-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        # Group of the state volume, so the web container (10001) can write it.
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The only privileged container: root reduced to the capabilities smbd
        # needs (CHOWN, FOWNER, DAC_OVERRIDE: accounts and Samba's files;
        # SETUID, SETGID: switching to each account; NET_BIND_SERVICE: port 445).
        - name: agent
          image: {{ include "smbdeck.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["agent"]
          env:
            - name: SMBDECK_ROOTS
              value: {{ include "smbdeck.roots" . | quote }}
            - name: SMBDECK_FILES_UID
              value: {{ .Values.filesUid | quote }}
            - name: SMBDECK_FILES_GID
              value: {{ .Values.filesGid | quote }}
            - name: SMBDECK_SMB_NETBIOS_NAME
              value: {{ .Values.samba.netbiosName | quote }}
            - name: SMBDECK_SMB_SERVER_STRING
              value: {{ .Values.samba.serverString | quote }}
            - name: SMBDECK_SMB_WORKGROUP
              value: {{ .Values.samba.workgroup | quote }}
            {{- with .Values.samba.hostsAllow }}
            - name: SMBDECK_SMB_HOSTS_ALLOW
              value: {{ join "," . | quote }}
            {{- end }}
            - name: SMBDECK_SMB_LOG_LEVEL
              value: {{ .Values.samba.logLevel | quote }}
            - name: SMBDECK_SMB_SIGNING
              value: {{ .Values.samba.signing | quote }}
            - name: SMBDECK_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: SMBDECK_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.agent.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: smb
              containerPort: 445
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: smb
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: smb
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: smb
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE", "SETUID", "SETGID", "NET_BIND_SERVICE"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
            # The agent's reports: written here, read-only for the console.
            - name: status
              mountPath: /status
            - name: run
              mountPath: /run/smbdeck
            - name: agent-tmp
              mountPath: /tmp
            {{- range $i, $r := .Values.roots }}
            - name: root-{{ $i }}
              mountPath: /roots/{{ $r.name }}
            {{- end }}
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        # The console: unprivileged, and no disk mounted, ever.
        - name: web
          image: {{ include "smbdeck.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["web"]
          env:
            - name: SMBDECK_LISTEN
              value: ":8080"
            {{- with .Values.web.allowedNetworks }}
            - name: SMBDECK_ALLOWED_NETWORKS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.web.trustedProxies }}
            - name: SMBDECK_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.web.smbHosts }}
            - name: SMBDECK_SMB_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- $hosts := list }}
            {{- range .Values.web.allowedHosts }}{{ $hosts = append $hosts . }}{{ end }}
            {{- if .Values.ingress.enabled }}{{ range .Values.ingress.hosts }}{{ $hosts = append $hosts .host }}{{ end }}{{ end }}
            {{- with $hosts }}
            - name: SMBDECK_ALLOWED_HOSTS
              value: {{ join "," (uniq .) | quote }}
            {{- end }}
            - name: SMBDECK_PASSWORD_MIN_LENGTH
              value: {{ .Values.web.passwordMinLength | quote }}
            - name: SMBDECK_COOKIE_SECURE
              value: {{ .Values.web.cookieSecure | quote }}
            - name: SMBDECK_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: SMBDECK_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- if .Values.seed.enabled }}
            - name: SMBDECK_SEED_FILE
              value: /seed/seed.json
            - name: SMBDECK_SEED_PASSWORDS_DIR
              value: /seed/passwords
            {{- end }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            {{- include "smbdeck.restricted" . | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /state
            - name: status
              mountPath: /status
              readOnly: true
            - name: web-tmp
              mountPath: /tmp
            {{- if .Values.seed.enabled }}
            - name: seed
              mountPath: /seed/seed.json
              subPath: seed.json
              readOnly: true
            - name: seed-passwords
              mountPath: /seed/passwords
              readOnly: true
            {{- end }}
            {{- with .Values.web.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "smbdeck.stateClaim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        # Generated accounts, smbpasswd, smb.conf and Samba's runtime files:
        # rebuilt from the desired state at every start, never persisted.
        # Rewritten by the agent at start: no need to persist it.
        - name: status
          emptyDir:
            sizeLimit: 16Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.agent.runSizeLimit }}
        - name: agent-tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: web-tmp
          emptyDir:
            sizeLimit: 8Mi
        {{- range $i, $r := .Values.roots }}
        # Root {{ $r.name }}: mounted into the agent only.
        - name: root-{{ $i }}
          hostPath:
            path: {{ $r.hostPath | quote }}
            type: {{ default "Directory" $r.type }}
        {{- end }}
        {{- if .Values.seed.enabled }}
        - name: seed
          configMap:
            name: {{ include "smbdeck.fullname" . }}-seed
        - name: seed-passwords
          secret:
            secretName: {{ .Values.seed.passwordsSecret }}
            defaultMode: 0440
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
