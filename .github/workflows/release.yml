name: Release

# On a v* tag: the checks again (lint, govulncheck, tests, Trivy,
# integration) and the chart's appVersion against the tag; then a multi-arch
# image on GHCR, SBOM (SPDX) and provenance attached to the image, keyless
# cosign signature (GitHub OIDC), GitHub release with the SBOM. Then the Helm
# chart, packaged and pushed to GHCR as an OCI artifact, signed the same way.
#
# Inert while the repository is private: publishing only makes sense once the
# project is public.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write   # the GitHub release
      packages: write   # GHCR
      id-token: write   # cosign keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing is published unless the tag, the chart and the checks agree:
      # the release does not trust that CI ran on this exact commit.
      - name: Chart version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          app=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' deploy/helm/smbdeck/Chart.yaml)
          if [ "v${app}" != "$TAG" ]; then
            echo "deploy/helm/smbdeck/Chart.yaml appVersion is ${app}, the tag is ${TAG}" >&2
            exit 1
          fi

      - name: Lint, vulnerabilities and unit tests
        run: make fmt-check lint vulncheck vet test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build linux/amd64 for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: smbdeck:release
          build-args: VERSION=${{ github.ref_name }}

      - name: Trivy and integration test
        run: |
          make scan IMAGE=smbdeck:release
          make test-integration IMAGE=smbdeck:release

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${REPO}@${DIGEST}"

      - name: SBOM for the release page
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: smbdeck-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes \
            --notes "Image: \`ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}\` (signed with cosign, keyless)." \
            "smbdeck-${TAG}.spdx.json"

  # A job of its own, after the image: a failure here leaves the image release
  # complete, and this job can be run again alone.
  chart:
    name: Publish the Helm chart
    needs: release
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # GHCR
      id-token: write   # cosign keyless signing
    env:
      CHART_DIR: deploy/helm/smbdeck
      CHART_REPO: ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The chart is pushed under its own version: it must be the tag's.
      - name: Chart version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "${CHART_DIR}/Chart.yaml")
          if [ "v${version}" != "$TAG" ]; then
            echo "${CHART_DIR}/Chart.yaml version is ${version}, the tag is ${TAG}" >&2
            exit 1
          fi
          echo "CHART_VERSION=${version}" >> "$GITHUB_ENV"

      # Helm comes with the runner image.
      - name: Package
        run: |
          helm version --short
          helm lint --strict "$CHART_DIR"
          helm package "$CHART_DIR" --destination dist

      - name: Push to GHCR
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/smbdeck-${CHART_VERSION}.tgz" "oci://${CHART_REPO}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: *\(sha256:[0-9a-f]\{64\}\)$/\1/p' push.log)
          if [ -z "$digest" ]; then
            echo "helm push printed no digest: the chart is pushed but not signed" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # cosign reads the registry credentials Docker keeps.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the chart (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO}/smbdeck@${DIGEST}"
